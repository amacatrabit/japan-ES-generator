name: ESWriterApp
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  ESWriterApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ESWriterApp/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.eswriter
        PRODUCT_NAME: ESWriter
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: ESWriter
        CODE_SIGN_STYLE: Automatic
    info:
      path: ESWriterApp/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    scheme:
      testTargets: []
