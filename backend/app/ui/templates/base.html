<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/ui/static/app.css" />
  </head>
  <body data-page="{{ page_key }}">
    <div class="shell">
      <header class="header">
        <div class="header-inner">
          <div class="row-between">
            <strong class="brand">ES Writer</strong>
            <span class="section-label">SOURCE-BASED DRAFTING</span>
          </div>
          <nav class="nav" aria-label="주요 메뉴">
            <a class="nav-link" data-nav="sources" href="/sources">소스</a>
            <a class="nav-link" data-nav="profile" href="/profile">프로필</a>
            <a class="nav-link" data-nav="company" href="/company">기업</a>
            <a class="nav-link" data-nav="drafts" href="/drafts">초안</a>
          </nav>
        </div>
      </header>

      <main class="main">
        <h1 class="page-title">{{ heading }}</h1>
        <p class="subtitle">근거 중심 작성 흐름을 동일한 UI 규칙으로 제공합니다.</p>
        <div class="grid">
          {{ content | safe }}
        </div>
      </main>
    </div>
    <script src="/ui/static/store.js"></script>
    <script src="/ui/static/app.js"></script>
  </body>
</html>
