<div class="card grouped">
  <p class="section-label">Input</p>
  <h2 class="section-title">소스 추가</h2>
  <input class="input" id="source-create-title" placeholder="제목" />
  <textarea class="input" rows="8" id="source-create-text" placeholder="텍스트를 입력하세요"></textarea>
  <div class="row">
    <button class="btn primary" type="button" id="source-create-btn">Save</button>
    <input class="input" type="file" id="source-upload-file" />
    <button class="btn" type="button" id="source-upload-btn">Upload</button>
  </div>
</div>

<div class="card grouped">
  <p class="section-label">Saved</p>
  <h2 class="section-title">소스 목록</h2>
  <div class="list" id="source-list"></div>
  <div class="empty" id="source-list-empty">저장된 소스가 없습니다.</div>
</div>

<div class="card grouped">
  <p class="section-label">Detail</p>
  <h2 class="section-title">소스 상세 편집</h2>
  <input class="input" id="source-detail-title" placeholder="제목" />
  <textarea class="input" rows="10" id="source-detail-text" placeholder="소스 본문"></textarea>
  <div class="row">
    <button class="btn primary" id="source-update-btn" type="button">Save Changes</button>
    <button class="btn" id="source-delete-btn" type="button">Delete</button>
    <button class="btn secondary" id="source-chunks-btn" type="button">Preview Chunks</button>
  </div>
  <div class="list" id="source-chunks-list"></div>
</div>

<div class="card" id="ui-toast" style="display:none;"></div>
