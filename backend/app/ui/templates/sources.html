<section class="section card grouped" id="sources-form-section">
  <h2>소스 추가</h2>
  <p class="muted">노트/텍스트를 먼저 추가하세요. 빈 줄 기준으로 청크가 생성됩니다.</p>
  <div class="inline-error" id="source-form-error"></div>
  <input class="input" id="source-title" placeholder="제목 (필수)" />
  <textarea class="input" rows="7" id="source-content" placeholder="텍스트 내용을 붙여넣기"></textarea>
  <button class="btn primary" type="button" id="source-add-btn">소스 추가</button>
</section>

<section class="section card grouped">
  <h2>소스 목록</h2>
  <div id="source-list" class="list"></div>
  <div class="empty-state" id="source-list-empty">아직 소스가 없습니다. 위에서 첫 소스를 추가하세요.</div>
</section>

<section class="section card grouped" id="source-detail-section">
  <div class="row-between">
    <h2 id="source-detail-title">소스 상세</h2>
    <input class="input search" id="chunk-search" placeholder="청크 검색" />
  </div>
  <div id="chunk-list" class="list"></div>
  <div class="empty-state" id="chunk-list-empty">소스를 선택하면 청크를 확인할 수 있습니다.</div>
</section>
