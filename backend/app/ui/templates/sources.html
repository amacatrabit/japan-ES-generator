<section class="section card grouped" id="sources-form-section">
  <h2>Add Source</h2>
  <p class="muted">Add note/text material first. Chunks are derived by blank lines.</p>
  <div class="inline-error" id="source-form-error"></div>
  <input class="input" id="source-title" placeholder="Title (required)" />
  <textarea class="input" rows="7" id="source-content" placeholder="Paste text content"></textarea>
  <button class="btn primary" type="button" id="source-add-btn">Add Source</button>
</section>

<section class="section card grouped">
  <h2>Sources</h2>
  <div id="source-list" class="list"></div>
  <div class="empty-state" id="source-list-empty">No sources yet. Add your first source above.</div>
</section>

<section class="section card grouped" id="source-detail-section">
  <div class="row-between">
    <h2 id="source-detail-title">Source Detail</h2>
    <input class="input search" id="chunk-search" placeholder="Search chunks" />
  </div>
  <div id="chunk-list" class="list"></div>
  <div class="empty-state" id="chunk-list-empty">Select a source to inspect derived chunks.</div>
</section>
