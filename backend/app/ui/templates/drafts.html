<section class="card grouped" id="draft-wizard">
  <p class="section-label">Wizard</p>
  <h2 class="section-title">초안 마법사</h2>

  <label>문항 유형</label>
  <select class="input" id="draft-question-type">
    <option value="gakuchika">gakuchika</option>
    <option value="self_pr">self_pr</option>
    <option value="motivation">motivation</option>
  </select>

  <label>글자 수 제한</label>
  <input class="input" id="draft-char-limit" type="number" min="100" max="1200" value="400" />

  <label>기업 선택</label>
  <select class="input" id="draft-company-select"></select>

  <label>프로필 선택</label>
  <select class="input" id="draft-profile-select"></select>

  <label>소스 선택</label>
  <div id="draft-source-picker" class="picker"></div>

  <div class="row">
    <button class="btn primary" type="button" id="draft-generate-btn">초안 생성</button>
    <button class="btn" type="button" id="draft-open-export">내보내기 열기</button>
  </div>

  <div class="inline-error" id="draft-generate-error"></div>
</section>

<section class="card grouped">
  <div class="row-between">
    <h2 class="section-title">드래프트 히스토리</h2>
    <div class="row">
      <button class="btn" type="button" id="draft-history-refresh">새로고침</button>
      <button class="btn" type="button" id="draft-history-clear">히스토리 삭제</button>
    </div>
  </div>
  <select class="input" id="draft-history-select"></select>
  <div class="muted">저장된 생성 결과를 다시 불러옵니다.</div>
</section>

<section class="card grouped">
  <h2 class="section-title">미리보기</h2>
  <div id="draft-preview" class="preview-box muted">아직 초안이 없습니다.</div>
  <div class="muted" id="draft-char-count">0 자</div>
  <div id="draft-qa-panel" class="list"></div>
</section>

<div class="modal hidden" id="export-modal">
  <div class="modal-backdrop" data-close-export="true"></div>
  <div class="modal-content grouped">
    <div class="row-between">
      <h2 class="section-title">초안 내보내기</h2>
      <button class="btn ghost" type="button" data-close-export="true">닫기</button>
    </div>
    <label>압축 레벨</label>
    <input class="input" id="export-compression-level" type="number" min="1" max="3" value="1" />
    <button class="btn primary" type="button" id="export-run-btn">내보내기 실행</button>
    <div id="export-output" class="preview-box"></div>
  </div>
</div>

<div class="card" id="ui-toast" style="display:none;"></div>
