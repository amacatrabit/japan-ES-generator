<section class="section card grouped" id="draft-wizard">
  <h2>Draft Wizard</h2>
  <div class="stepper">
    <span class="step active" data-step="1">1. Question</span>
    <span class="step" data-step="2">2. Episodes</span>
    <span class="step" data-step="3">3. Evidence</span>
    <span class="step" data-step="4">4. Generate</span>
  </div>

  <div class="wizard-step" id="wizard-step-1">
    <label>Question Type</label>
    <select class="input" id="draft-question-type">
      <option value="gakuchika">gakuchika</option>
      <option value="self_pr">self_pr</option>
      <option value="motivation">motivation</option>
      <option value="strengths_weaknesses">strengths_weaknesses</option>
      <option value="future_plan">future_plan</option>
      <option value="job_hunting_axis">job_hunting_axis</option>
    </select>
    <label>Character Limit</label>
    <div class="row">
      <button class="btn" data-char-preset="250" type="button">250</button>
      <button class="btn" data-char-preset="400" type="button">400</button>
      <button class="btn" data-char-preset="600" type="button">600</button>
      <input class="input" id="draft-char-limit" type="number" min="100" max="1200" value="400" />
    </div>
    <label>Company Context (optional)</label>
    <select class="input" id="draft-company-select"></select>
  </div>

  <div class="wizard-step hidden" id="wizard-step-2">
    <p class="muted">Select episodes to include in generation.</p>
    <div id="draft-episode-picker" class="picker"></div>
  </div>

  <div class="wizard-step hidden" id="wizard-step-3">
    <div class="row-between">
      <p class="muted">Select evidence chunks (pinned shown first).</p>
      <input class="input search" id="draft-chunk-search" placeholder="Search chunks" />
    </div>
    <div id="draft-chunk-picker" class="picker"></div>
  </div>

  <div class="wizard-step hidden" id="wizard-step-4">
    <div class="inline-error" id="draft-generate-error"></div>
    <button class="btn primary" type="button" id="draft-generate-btn">Generate Draft</button>
  </div>

  <div class="row-between">
    <button class="btn" type="button" id="draft-prev-step">Back</button>
    <button class="btn primary" type="button" id="draft-next-step">Next</button>
  </div>
</section>

<section class="section card grouped">
  <div class="row-between">
    <h2>Review</h2>
    <select class="input search" id="draft-history-select"></select>
  </div>
  <div id="draft-preview" class="preview-box muted">No draft yet.</div>
  <div class="muted" id="draft-char-count">0 chars</div>
  <div id="draft-claims" class="list"></div>
</section>

<section class="section card grouped">
  <h2>QA Panel</h2>
  <div id="draft-qa-panel" class="list"></div>
</section>

<section class="section card grouped">
  <div class="row-between">
    <h2>Export</h2>
    <button class="btn primary" type="button" id="draft-open-export">Open Export</button>
  </div>
</section>

<div class="modal hidden" id="export-modal">
  <div class="modal-backdrop" data-close-export="true"></div>
  <div class="modal-content card grouped">
    <div class="row-between">
      <h2>Export Draft</h2>
      <button class="btn" type="button" data-close-export="true">Close</button>
    </div>
    <label>Mode</label>
    <select class="input" id="export-mode">
      <option value="strict" selected>strict</option>
      <option value="relaxed">relaxed</option>
    </select>
    <label>Compression Level</label>
    <input class="input" id="export-compression" type="number" min="1" max="3" value="1" />
    <div class="inline-error" id="export-error"></div>
    <button class="btn primary" type="button" id="export-run-btn">Run Export</button>
    <textarea class="input" rows="8" id="export-result" placeholder="Exported text will appear here"></textarea>
    <button class="btn" type="button" id="export-copy-btn">Copy</button>
  </div>
</div>
