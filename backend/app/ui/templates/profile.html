<div class="card grouped">
  <p class="section-label">Input</p>
  <h2 class="section-title">프로필 생성/수정</h2>
  <input class="input" id="profile-name" placeholder="프로필 이름" />
  <input class="input" id="ep-title" placeholder="episode title" />
  <textarea class="input" rows="2" id="ep-situation" placeholder="situation"></textarea>
  <textarea class="input" rows="2" id="ep-task" placeholder="task"></textarea>
  <textarea class="input" rows="2" id="ep-action" placeholder="action"></textarea>
  <textarea class="input" rows="2" id="ep-result" placeholder="result"></textarea>
  <textarea class="input" rows="2" id="ep-learning" placeholder="learning"></textarea>
  <div class="row">
    <button class="btn primary" id="profile-save-btn" type="button">Save</button>
  </div>
</div>

<div class="card grouped">
  <p class="section-label">Saved</p>
  <h2 class="section-title">프로필 목록</h2>
  <div class="list" id="profile-list"></div>
  <div class="empty" id="profile-list-empty">저장된 프로필이 없습니다.</div>
</div>

<div class="card grouped">
  <p class="section-label">Detail</p>
  <h2 class="section-title">프로필 상세</h2>
  <div class="row">
    <button class="btn primary" id="profile-update-btn" type="button">Save Changes</button>
    <button class="btn" id="profile-delete-btn" type="button">Delete</button>
  </div>
</div>

<div class="card" id="ui-toast" style="display:none;"></div>
