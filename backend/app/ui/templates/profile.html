<section class="section card grouped">
  <h2 class="section-title">프로필</h2>
  <label>이름</label>
  <input class="input" id="profile-name" placeholder="이름" />
  <h3>작성 규칙</h3>
  <label><input type="checkbox" id="rule-avoid-teiru" /> avoid_teiru</label>
  <label><input type="checkbox" id="rule-prefer-omou" /> prefer_omou_over_kangaeru</label>
  <label><input type="checkbox" id="rule-avoid-kanji" /> avoid_excessive_kanji_compounds</label>
</section>

<section class="section card grouped">
  <div class="row-between">
    <h2 class="section-title">에피소드</h2>
    <button class="btn primary" id="episode-add-btn" type="button">에피소드 추가</button>
  </div>
  <div id="episode-list" class="list"></div>
  <div class="empty-state" id="episode-empty">에피소드가 없습니다.</div>
</section>

<div class="modal hidden" id="episode-modal">
  <div class="modal-backdrop" data-close-modal="true"></div>
  <div class="modal-content card grouped">
    <div class="row-between">
      <h2 class="section-title" id="episode-modal-title">에피소드</h2>
      <button class="btn" type="button" data-close-modal="true">닫기</button>
    </div>
    <div class="inline-error" id="episode-form-error"></div>
    <input class="input" id="ep-title" placeholder="제목" />
    <input class="input" id="ep-period" placeholder="기간" />
    <textarea class="input" rows="2" id="ep-context" placeholder="상황"></textarea>
    <textarea class="input" rows="2" id="ep-role" placeholder="역할"></textarea>
    <textarea class="input" rows="2" id="ep-goal" placeholder="목표"></textarea>
    <textarea class="input" rows="2" id="ep-problem" placeholder="문제"></textarea>
    <input class="input" id="ep-action1" placeholder="행동 1" />
    <input class="input" id="ep-action2" placeholder="행동 2" />
    <input class="input" id="ep-action3" placeholder="행동 3" />
    <input class="input" id="ep-results-quant" placeholder="정량 결과" />
    <textarea class="input" rows="2" id="ep-results-qual" placeholder="정성 결과"></textarea>
    <textarea class="input" rows="2" id="ep-learning" placeholder="배운 점"></textarea>
    <div class="row-between">
      <strong>근거 청크 연결</strong>
      <button class="btn" id="open-evidence-picker" type="button">청크 선택</button>
    </div>
    <div id="ep-linked-chunks" class="chips"></div>
    <button class="btn primary" id="episode-save-btn" type="button">저장</button>
  </div>
</div>

<div class="modal hidden" id="evidence-modal">
  <div class="modal-backdrop" data-close-evidence-modal="true"></div>
  <div class="modal-content card grouped">
    <div class="row-between">
      <h2 class="section-title">근거 청크 선택</h2>
      <button class="btn" data-close-evidence-modal="true" type="button">닫기</button>
    </div>
    <input class="input" id="evidence-search" placeholder="청크 검색" />
    <div id="evidence-picker" class="picker"></div>
    <button class="btn primary" id="evidence-apply" type="button">적용</button>
  </div>
</div>
