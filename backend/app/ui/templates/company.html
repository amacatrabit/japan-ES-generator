<section class="section card grouped">
  <div class="row-between">
    <h2 class="section-title">기업</h2>
    <button class="btn primary" id="company-add-btn" type="button">기업 추가</button>
  </div>
  <div id="company-list" class="list"></div>
  <div class="empty-state" id="company-empty">기업이 없습니다.</div>
</section>

<section class="section card grouped" id="company-detail-section">
  <h2 class="section-title" id="company-detail-title">기업 상세</h2>
  <div class="grouped">
    <strong>연결 소스</strong>
    <div id="company-source-links" class="list"></div>
  </div>
  <div class="grouped">
    <strong>핵심 키워드</strong>
    <div class="row">
      <input class="input" id="company-phrase-input" placeholder="키워드" />
      <button class="btn" id="company-phrase-add" type="button">추가</button>
    </div>
    <div id="company-phrase-list" class="chips"></div>
  </div>
  <div class="grouped">
    <div class="row-between">
      <strong>질문 세트</strong>
      <button class="btn" id="company-question-add" type="button">질문 추가</button>
    </div>
    <div id="company-question-list" class="list"></div>
  </div>
</section>

<div class="modal hidden" id="company-modal">
  <div class="modal-backdrop" data-close-company-modal="true"></div>
  <div class="modal-content card grouped">
    <div class="row-between">
      <h2 class="section-title" id="company-modal-title">기업 추가</h2>
      <button class="btn" data-close-company-modal="true" type="button">닫기</button>
    </div>
    <div class="inline-error" id="company-form-error"></div>
    <input class="input" id="company-name" placeholder="기업명" />
    <input class="input" id="company-role" placeholder="직무" />
    <button class="btn primary" id="company-save-btn" type="button">저장</button>
  </div>
</div>
