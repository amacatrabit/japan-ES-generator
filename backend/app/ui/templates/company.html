<section class="section card grouped">
  <h2>Company</h2>
  <div class="inline-error" id="company-form-error"></div>
  <input class="input" id="company-name" placeholder="Company name" />
  <input class="input" id="company-role" placeholder="Role" />
  <button class="btn primary" type="button" id="company-add-btn">Add Company</button>
</section>

<section class="section card grouped">
  <h2>Companies</h2>
  <div id="company-list" class="list"></div>
  <div class="empty-state" id="company-empty">No companies yet.</div>
</section>

<section class="section card grouped" id="company-detail-section">
  <h2 id="company-detail-title">Company Detail</h2>
  <div class="grouped">
    <strong>Key Phrase Chips</strong>
    <div class="row">
      <input class="input" id="company-phrase-input" placeholder="Add key phrase" />
      <button class="btn" type="button" id="company-phrase-add">Add</button>
    </div>
    <div id="company-phrase-list" class="chips"></div>
  </div>

  <div class="grouped">
    <strong>Linked Sources</strong>
    <div id="company-source-links" class="list"></div>
  </div>

  <div class="grouped">
    <div class="row-between">
      <strong>Question Set</strong>
      <button class="btn" id="company-question-add" type="button">+ Add Question</button>
    </div>
    <div id="company-question-list" class="list"></div>
  </div>
</section>
