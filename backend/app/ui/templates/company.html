<div class="card grouped">
  <p class="section-label">Company</p>
  <h2 class="section-title">기업 리서치 / 질문 템플릿</h2>
  <input class="input" id="company-name-input" placeholder="기업명" />
  <input class="input" id="company-role-input" placeholder="직무" />
  <textarea class="input" rows="4" id="company-research-input" placeholder="리서치 요약"></textarea>
  <textarea class="input" rows="4" id="company-questions-input" placeholder="질문 템플릿(줄바꿈 구분)"></textarea>
  <div class="row">
    <button class="btn primary" id="company-save-btn" type="button">Save</button>
    <button class="btn" id="company-generate-btn" type="button">Generate Research (LLM)</button>
    <button class="btn" id="company-delete-btn" type="button">Delete</button>
  </div>
</div>

<div class="card grouped">
  <p class="section-label">Saved</p>
  <h2 class="section-title">기업 목록</h2>
  <div id="company-list" class="list"></div>
  <div class="empty" id="company-list-empty">저장된 기업이 없습니다.</div>
</div>

<div class="card" id="ui-toast" style="display:none;"></div>
