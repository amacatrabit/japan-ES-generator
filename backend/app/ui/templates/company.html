<section class="card grouped">
  <p class="section-label">Company Input</p>
  <h2 class="section-title">기업 추가</h2>
  <input class="input" id="company-name" placeholder="기업명" />
  <input class="input" id="company-role" placeholder="직무" />
  <textarea class="input" rows="4" id="company-info" placeholder="기업/인재상 메모"></textarea>
  <textarea class="input" rows="2" id="company-question-template" placeholder="질문 템플릿"></textarea>
  <input class="input" id="company-char-limit" type="number" min="100" max="1200" value="400" />
  <div class="row">
    <button class="btn" id="company-research-btn" type="button">AI Research</button>
    <button class="btn primary" id="company-save-btn" type="button">Save</button>
  </div>
</section>

<section class="card grouped">
  <p class="section-label">Saved Companies</p>
  <h2 class="section-title">기업 목록</h2>
  <div id="company-list" class="list"></div>
  <div class="empty" id="company-empty">저장된 기업이 없습니다.</div>
</section>

<section class="card grouped">
  <p class="section-label">Detail</p>
  <h2 class="section-title">기업 상세 편집</h2>
  <input class="input" id="company-detail-name" placeholder="기업명" />
  <input class="input" id="company-detail-role" placeholder="직무" />
  <textarea class="input" rows="4" id="company-detail-info" placeholder="기업/인재상 메모"></textarea>
  <textarea class="input" rows="2" id="company-detail-question-template" placeholder="질문 템플릿"></textarea>
  <input class="input" id="company-detail-char-limit" type="number" min="100" max="1200" value="400" />
  <div class="row">
    <button class="btn primary" id="company-update-btn" type="button">Save Changes</button>
    <button class="btn" id="company-delete-btn" type="button">Delete</button>
  </div>
</section>

<div class="card" id="ui-toast" style="display:none;"></div>
